    <style>
      body {
        font-family: "Manrope", sans-serif;
        cursor: none;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 300,
          "GRAD" 0,
          "opsz" 24;
      }
      .custom-cursor {
        width: 8px;
        height: 8px;
        background: #5f5e5e;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        transition:
          width 0.3s,
          height 0.3s,
          background 0.3s;
      }
      .text-reveal {
        overflow: hidden;
      }
      .text-reveal span {
        display: block;
        transform: translateY(110%);
      }
      .glass-nav {
        backdrop-filter: blur(32px);
      }
      .asymmetric-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
      }
      /* Hide scrollbar but keep functionality */
      ::-webkit-scrollbar {
        display: none;
      }
      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      :is(a, button) {
        cursor: inherit !important;
      }
      #cursor {
        background-color: #fff;
      }
    </style>

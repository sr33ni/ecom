<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSAP Mobile Pro Demo</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Lenis -->
<script src="https://unpkg.com/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0f0f0f;
  color: white;
  overflow-x: hidden;
}

/* Smooth scroll sections */
section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Cards */
.container {
  position: relative;
  width: 100%;
  height: 100vh;
}

.card {
  position: absolute;
  width: 80%;
  height: 60%;
  top: 20%;
  left: 10%;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: white;
}

/* Different colors */
.card:nth-child(1){ background:#ff4d4d; }
.card:nth-child(2){ background:#4da6ff; }
.card:nth-child(3){ background:#4dff88; }
</style>
</head>

<body>

<section>Scroll Down 👇</section>

<section>
  <div class="container">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>
</section>

<section>End 🎉</section>

<script>
/* =========================
   🌊 LENIS SMOOTH SCROLL
========================= */
const lenis = new Lenis({
  smooth: true
});

function raf(time) {
  lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

/* Sync GSAP ScrollTrigger */
gsap.registerPlugin(ScrollTrigger);

lenis.on("scroll", ScrollTrigger.update);

gsap.ticker.add((time)=>{
  lenis.raf(time * 1000);
});

/* =========================
   🎯 STACK + SNAP CARDS
========================= */
const cards = document.querySelectorAll(".card");

cards.forEach((card, index) => {
  // stack effect
  gsap.set(card, {
    zIndex: cards.length - index,
    scale: 1 - index * 0.05,
    y: index * 10
  });

  Draggable.create(card, {
    type: "x",
    inertia: true,

    onDrag() {
      gsap.to(card, {
        rotation: this.x / 8
      });
    },

    onDragEnd() {
      if (this.x > 120) {
        swipe(card, 1);
      } else if (this.x < -120) {
        swipe(card, -1);
      } else {
        // 🎯 SNAP BACK
        gsap.to(card, {
          x: 0,
          rotation: 0,
          duration: 0.3,
          ease: "power2.out"
        });
      }
    }
  });
});

function swipe(card, dir) {
  gsap.to(card, {
    x: dir * 500,
    rotation: dir * 45,
    opacity: 0,
    duration: 0.4,
    onComplete: () => {
      card.remove();
      restack();
    }
  });
}

/* Re-stack remaining cards */
function restack() {
  const remaining = document.querySelectorAll(".card");

  remaining.forEach((card, i) => {
    gsap.to(card, {
      scale: 1 - i * 0.05,
      y: i * 10,
      duration: 0.3
    });
  });
}

/* =========================
   📜 SCROLL ANIMATION
========================= */
gsap.from(".card", {
  scrollTrigger: {
    trigger: ".container",
    start: "top 80%"
  },
  y: 100,
  opacity: 0,
  stagger: 0.2,
  duration: 0.6
});
</script>

</body>
</html>
